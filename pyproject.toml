[project]
name = "reelrank"
version = "0.1.0"
description = "Two-stage short-video recommender on KuaiRand-Pure"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=14.0",
  "scikit-learn>=1.3",
  "torch>=2.1",
  "faiss-cpu>=1.7.4",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "httpx>=0.26",
  "locust>=2.24",
  "tqdm>=4.66",
  "scipy>=1.11",
  "pillow>=13.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reelrank"]

[tool.pytest.ini_options]
testpaths = ["tests"]
